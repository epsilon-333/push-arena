# Render 배포 설정 (Blueprint). 무료 웹 서비스 하나로 게임 서버 + 화면을 같이 제공한다.
services:
  - type: web
    name: push-arena
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    # 계정 저장 (Supabase). 값은 Render 대시보드 → Environment 에서 넣는다 (여기에 쓰지 말 것)
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
