<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Push Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
</head>
<body>
  <div id="stage"></div>

  <!-- 표지 -->
  <div id="title">
    <div class="logo">
      <div class="logo-sub">밀고 · 버티고 · 살아남기</div>
      <h1>PUSH<span>ARENA</span></h1>
    </div>
    <div class="bottom">
    <div class="start-box">
      <input id="nickname" maxlength="10" placeholder="닉네임" autocomplete="off">
      <button id="start">게임 시작</button>
    </div>
    <button id="practice">🤖 봇이랑 연습하기</button>
    <button id="btn-emotes">😜 이모티콘 고르기</button>
    <div class="controls"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 <kbd class="wide">Space</kbd> 밀치기 <kbd>마우스</kbd> 시점</div>
      <div class="controls-sub">게임 중 화면을 클릭하면 마우스로 시점을 돌려요 (Esc로 해제)</div>
    </div>
  </div>

  <!-- 게임 HUD -->
  <div id="hud" hidden>
    <div id="scoreboard"></div>
    <div id="rule" hidden></div>
    <div id="message"></div>
    <div id="skills" hidden></div>
    <div id="emotes"></div>
    <button id="mute" title="음량">🔊</button>
    <div id="volume" hidden><input type="range" min="0" max="100" step="5"><span>70</span></div>
    <div id="help"><kbd>WASD</kbd> 이동 <kbd>Space</kbd> 밀치기 <kbd>Q</kbd><kbd>E</kbd> 스킬 <kbd>마우스</kbd> 시점 <kbd>1~4</kbd> 감정</div>
  </div>
  <div id="labels"></div>

  <!-- 폰 조작 (터치 기기에서만 보임) -->
  <div id="touch" hidden>
    <div class="stick"><div class="knob"></div></div>
    <button class="btn-push">밀치기</button>
    <div class="rotate-hint">📱 가로로 돌리면 더 넓게 보여요</div>
  </div>

  <!-- 이모티콘 고르기 -->
  <div id="emote-picker" hidden>
    <div class="ep-box">
      <div class="ep-title">이모티콘 4개 고르기 <span class="ep-count"></span></div>
      <div class="ep-sub">누른 순서대로 1~4번 키에 들어가요</div>
      <div class="ep-grid"></div>
      <div class="ep-buttons"><button class="ep-done">완료</button><button class="ep-cancel">취소</button></div>
    </div>
  </div>

  <!-- 대기실 -->
  <div id="lobby" hidden>
    <div class="lobby-box">
      <div class="lobby-title">대기실</div>
      <div class="lobby-list"></div>
      <button id="btn-bots">🤖 빈자리 AI 채우기: 켬</button>
      <button id="btn-start">시작하기</button>
      <div class="lobby-timer"></div>
    </div>
  </div>

  <!-- 연결 중 -->
  <div id="connecting" hidden>
    <div class="spinner"></div>
    <div class="conn-title"></div>
    <div class="conn-sub"></div>
  </div>

  <!-- 최종 순위 -->
  <div id="results" hidden>
    <div class="results-box">
      <div class="results-title">🏆 최종 순위</div>
      <div class="results-list"></div>
      <div class="results-buttons">
        <button id="btn-restart">다시 하기</button>
        <button id="btn-exit">처음 화면으로</button>
      </div>
      <div class="results-timer"></div>
    </div>
  </div>

  <!-- 능력 선택 -->
  <div id="cards" hidden>
    <div class="cards-title">능력 카드를 한 장 고르세요</div>
    <div class="list"></div>
    <div class="timer"></div>
    <div id="swap-skill" hidden></div>
  </div>

  <script type="module" src="client.js"></script>
</body>
</html>
